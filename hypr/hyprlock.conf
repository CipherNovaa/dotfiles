# hyprlock.conf — Hyprland native lock screen
# Replaces i3lock

# Colors come from pywal, regenerated on every wallpaper change.
source = ~/.cache/wal/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    # Static frame of the current main wallpaper (regenerated on each change by
    # update-hyprlock-bg.sh). hyprlock can't read the current-main pointer or GIFs.
    path = ~/.cache/wal/hyprlock-bg.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.4
    contrast = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.3
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.18
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    fade_on_empty = true
    placeholder_text = <span foreground="##$muted_hex">password</span>
    hide_input = false
    check_color = $ok
    fail_color = $err
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $caps
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $fg
    font_size = 72
    font_family = Iosevka Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $accent2
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
