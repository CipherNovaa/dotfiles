# hypridle.conf — idle management for Hyprland
# Replaces xss-lock + i3lock combo

general {
    lock_cmd = ~/scripts/system/lock-crt-sleep.sh
    before_sleep_cmd = loginctl lock-session
    # Relight the CRT after wake ONLY if the session is unlocked (otherwise the
    # lock screen reappears on the tube). lock-crt-sleep.sh relights on unlock.
    after_sleep_cmd = ~/scripts/system/idle-crt-on.sh
    ignore_dbus_inhibit = false
}

# NOTE: a "dim after 3 min" listener used to live here (brightnessctl -s set 30%),
# but this desktop exposes no backlight class device (`brightnessctl -l` is empty),
# so it was a no-op and has been removed. The main LED (DP-3) now DOES sleep on
# idle — see the 30-minute listener below — via the kernel sysfs force-disconnect
# (dp-power), NOT compositor dpms (which crashes the shared CRTC pool) and NOT
# ddcutil (the HKC 27E3Q's DDC dies when it blanks). DP-3 sleep is gated to
# "only while locked" so it never blanks during normal work.

# Lock after 15 minutes — skipped while a *video* is actively playing (music does
# not defer the lock; see idle-media-active.sh). Bumped from 5min (2026-09-22).
listener {
    timeout = 900
    on-timeout = ~/scripts/system/idle-lock.sh
}

# CRT idle-off (was 8 min) intentionally REMOVED (2026-09-22). The CRT gets NO
# standalone idle behaviour — it goes dark ONLY when the session locks (via
# lock_cmd = lock-crt-sleep.sh) and relights on unlock. A recurring idle timer was
# force-disconnecting/reconnecting the tube's connector all day, which wasn't
# wanted. (idle-crt-on.sh is still used by after_sleep_cmd above for suspend-wake.)

# Sleep the MAIN monitor (DP-3) after 30 minutes, but ONLY while locked (so the
# main LED never blanks during normal work) — kernel sysfs force-disconnect via
# dp-power, never compositor dpms. Wakes on ANY input so the lock screen is
# visible to type (idle-dp-on.sh relights even while still locked; the CRT stays
# dark until you actually unlock). Works around an HKC 27E3Q monitor bug.
#
# Timing: this MUST stay > the 15-min auto-lock above, or the two fire together
# and idle-dp-off runs before hyprlock is up (its pidof gate fails -> DP never
# darkens). 30min = "15 min after the lock" for the idle path; a manual Pause
# darkens DP-3 30 min later.
listener {
    timeout = 1800
    on-timeout = ~/scripts/system/idle-dp-off.sh
    on-resume  = ~/scripts/system/idle-dp-on.sh
}

# Auto-suspend is intentionally OFF (2026-09-22). This is the media HUB: it serves
# HLS/DASH + casts, and codec only holds a suspend-inhibitor during LOCAL playback
# (appcontroller.cpp updateIdleInhibit), NOT during a cast — so an idle auto-suspend
# would sleep the box mid-cast and kill the stream + serving. Suspend manually if
# ever needed (it still locks first via before_sleep_cmd). Do NOT re-add a bare
# `systemctl suspend` listener without a cast/serve-aware inhibitor.
